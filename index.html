  <body class="bg-black text-zinc-100 min-h-screen overflow-x-hidden font-sans">
    <div id="root"></div>

    <!-- Botpress WebChat Global Scripts -->
    <script>
      // Garantizar hideWidget: true para no mostrar la burbuja por defecto de Botpress
      window.botpress = new Proxy(window.botpress || {}, {
        set(target, prop, value) {
          if (prop === 'init' && typeof value === 'function') {
            target[prop] = function(config) {
              if (config) {
                config.hideWidget = true;
                if (config.configuration) config.configuration.hideWidget = true;
              }
              return value.call(this, config);
            };
            return true;
          }
          target[prop] = value;
          return true;
        }
      });
    </script>
    <script src="https://cdn.botpress.cloud/webchat/v3.7/inject.js"></script>
    <script src="https://files.bpcontent.cloud/2026/10/07/20/20261007202241-0CDTTV0A.js" defer></script>

  </body>
